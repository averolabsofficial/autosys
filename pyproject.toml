[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosys"
version = "2.0.2"
description = "Your project's command center — ship-readiness grading, secret scanning, version drift detection, checkpoints, and one-command releases from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Averolabs Official" }]
keywords = ["git", "github", "cli", "devops", "release", "productivity", "git-workflow"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/averolabsofficial/autosys"
Repository = "https://github.com/averolabsofficial/autosys"
Issues = "https://github.com/averolabsofficial/autosys/issues"
Documentation = "https://github.com/averolabsofficial/autosys/blob/main/MANUAL.md"

[project.scripts]
autosys = "autosys:main"

# AutoSys ships as a single-file module — no package directory needed.
[tool.setuptools]
py-modules = ["autosys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
